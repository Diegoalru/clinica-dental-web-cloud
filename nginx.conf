# Servidor de la SPA (React + Vite) dentro del contenedor. Reemplaza /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # add_header solo se hereda si el bloque no define otro, por eso los encabezados se repiten en cada location
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Archivos con hash en el nombre (los genera Vite): se pueden guardar un año sin revalidar.
    # Si no existen, 404; no se devuelve index.html en su lugar
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # index.html siempre se revalida: así el navegador toma la versión nueva después de cada despliegue
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Rutas del cliente (/login, /inicio...): si no es un archivo, se sirve index.html y decide React Router.
    # Así recargar la página en una ruta interna no da 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
